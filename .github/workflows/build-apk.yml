nombre: Crear APK de Android

en:
  empujar:
    sucursales: [ principal ]
  despacho de flujo de trabajo:

empleos:
  construir:
    corre: ubuntu-latest

    pasos:
    - nombre: Repositorio de cheques
      usos: acciones/checkout@v4

    - nombre: Configurar Node.js
      usos: acciones/configuración-nodo@v4
      con:
        versión del nodo: 22

    - nombre: Instalar dependencias y crear recursos web
      correr: |
        npm install
        npm run build:android

    - nombre: Configurar JDK 17
      usos: acciones/configuración-java@v4
      con:
        versión de java: '17'
        distribución: 'temurin'

    - nombre: Configurar el SDK de Android
      usos: android-actions/setup-android@v3

    - nombre: Aceptar licencias del SDK de Android
      correr: yes | sdkmanager --licenses || true

    - nombre: Otorgar permisos de ejecución para gradlew
      correr: chmod +x android/gradlew

    - nombre: Compilación de APK de depuración
      correr: |
        cd android
        ./gradlew assembleDebug --no-daemon

    - nombre: Cargar artefacto APK
      usos: acciones/cargar-artefacto@v4
      con:
        nombre: Exportador de catálogos para Android (APK)
        camino: android/app/build/outputs/apk/debug/*.apk
